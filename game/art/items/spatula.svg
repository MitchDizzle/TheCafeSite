    drawing was a square with the handle on its corner). -->
  <g transform="rotate(-45 32 32)">
    <path d="M32 26v9" stroke="#1F4552" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 26v9" stroke="#8E9AA0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M32 37v20" stroke="#1F4552" stroke-width="9" stroke-linecap="round"/>
    <path d="M32 37v20" stroke="#B98552" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="43" r="1.2" fill="#E6ECEE"/><circle cx="32" cy="51" r="1.2" fill="#E6ECEE"/>
    <path class="blade" d="M17 5h30l-3 21H20z" fill="#C5CFD3" stroke="#1F4552" stroke-width="2.5" stroke-linejoin="round"/>
    <path class="blade2" d="M25 10v11M32 10v11M39 10v11" stroke="#8E9AA0" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 8h24" stroke="#E6ECEE" stroke-width="2" stroke-linecap="round"/>
