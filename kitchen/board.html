<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Orders</title>
<style>
  /* System fonts on purpose: the kitchen PC must not depend on Google Fonts
     loading to be readable. Sizes scale with the screen like /menu-board. */
  :root {
    --cream: #FAF7F2;
    --teal: #2C5E70;
    --teal-dark: #1F4552;
    --ground: #15323C;
    --red: #C0392F;
    --red-dark: #A02F26;
    --amber: #E8A33D;
    --mint: #8ED9D4;
    --text: #22323A;
    --muted: #5B6B72;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(14px, 1.15vw, 26px); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  body.idle { cursor: none; }

  /* Three zones: order count and Undo on the left, the clock dead centre
     (where a glance from the line finds it), status and the power menu on
     the right. The outer columns are equal so the clock never drifts off
     centre when Undo appears or the count changes. */
  .bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1.25rem;
    padding: 0.5rem 1.25rem;
    background: var(--teal-dark);
    color: var(--cream);
  }
  .bar-left, .bar-right { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .bar-right { justify-content: flex-end; gap: 0.6rem; }
  .bar .count { font-size: 1.4rem; font-weight: 700; white-space: nowrap; }
  .bar .clock { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 2.8rem;
    height: 2.8rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--cream);
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .icon-btn:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .icon-btn svg { width: 100%; height: 100%; overflow: visible; }

  /* Muted is amber, not just a different icon: a silent board in a loud
     kitchen should be noticeable from across the room. */
  .sound .waves { display: inline; }
  .sound .cross { display: none; }
  .sound.is-muted { color: var(--amber); }
  .sound.is-muted .waves { display: none; }
  .sound.is-muted .cross { display: inline; }

  /* The refresh button's ring empties as the next Square check approaches,
     then refills when it runs. Amber when Square can't be reached. */
  .refresh .track { stroke: rgba(250, 247, 242, 0.22); }
  .refresh .ring { stroke: var(--mint); transform: rotate(-90deg); transform-origin: 22px 22px; }
  .refresh.is-down .ring { stroke: var(--amber); }
  .refresh.is-checking svg .glyph-spin { animation: spin 0.8s linear infinite; transform-origin: 22px 22px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh.is-checking svg .glyph-spin { animation: none; opacity: 0.6; } }
  .undo {
    font: inherit;
    font-size: 1rem;
    padding: 0.45rem 1rem;
    border: 2px solid var(--cream);
    border-radius: 0.4rem;
    background: transparent;
    color: var(--cream);
    cursor: pointer;
  }
  .undo[hidden] { display: none; }

  .keys b { display: inline-block; min-width: 1.6em; padding: 0 0.3em; border: 2px solid currentColor; border-radius: 0.3rem; text-align: center; font-weight: 800; }

  /* ---- power menu (mouse only: no number-pad key opens or confirms it) */
  .power-wrap { position: relative; }
  .power.is-open { background: rgba(255, 255, 255, 0.16); }
  .menu {
    position: absolute;
    right: 0;
    top: calc(100% + 0.5rem);
    z-index: 20;
    min-width: 17rem;
    padding: 0.4rem;
    background: var(--cream);
    border-radius: 0.5rem;
    box-shadow: 0 0.4rem 1.4rem rgba(0, 0, 0, 0.5);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
    padding: 0.75rem 0.9rem;
    border: 0;
    border-radius: 0.35rem;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: #EAE3D7; outline: none; }
  .menu svg { width: 1.4rem; height: 1.4rem; flex: none; }
  .menu hr { border: 0; border-top: 1px solid #DDD5C8; margin: 0.3rem 0.4rem; }
  .menu .danger { color: var(--red-dark); }

  /* ---- dialogs: settings & help, and every power action's confirmation */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: rgba(10, 25, 30, 0.75);
  }
  .scrim[hidden] { display: none; }
  .dialog {
    width: min(40rem, 90vw);
    padding: 1.6rem 1.8rem;
    background: var(--cream);
    color: var(--text);
    border-radius: 0.6rem;
    box-shadow: 0 0.6rem 2rem rgba(0, 0, 0, 0.6);
  }
  .dialog h2 { margin: 0 0 0.6rem; font-size: 1.8rem; }
  .dialog p { margin: 0 0 1rem; font-size: 1.25rem; line-height: 1.4; }
  .dialog .count-down { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red-dark); }
  .dialog .actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.2rem; }
  .dialog .actions button, .dialog .link-btn {
    font: inherit;
    font-size: 1.25rem;
    font-weight: 800;
    padding: 0.75rem 1.4rem;
    border-radius: 0.4rem;
    border: 2px solid var(--teal);
    background: transparent;
    color: var(--teal-dark);
    cursor: pointer;
    text-decoration: none;
  }
  .dialog .actions .primary { background: var(--teal); color: var(--cream); }
  .dialog .actions .danger { background: var(--red); border-color: var(--red); color: #fff; }
  .dialog .keys-table { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem 1rem; align-items: center; margin: 0 0 1.2rem; font-size: 1.25rem; }
  .dialog .meta { font-size: 1.05rem; color: var(--muted); }
  .more {
    position: fixed;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    padding: 0.6rem 1.4rem;
    border-radius: 2rem;
    background: var(--amber);
    color: #1A1A1A;
    font-size: 1.2rem;
    font-weight: 800;
    box-shadow: 0 0.2rem 0.8rem rgba(0, 0, 0, 0.5);
  }
  .more[hidden] { display: none; }

  .alert {
    padding: 0.7rem 1.25rem;
    background: var(--amber);
    color: #1A1A1A;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .alert[hidden] { display: none; }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
    gap: 1rem;
    align-items: start;
    padding: 1rem 1.25rem 2rem;
  }
  .empty {
    grid-column: 1 / -1;
    margin-top: 18vh;
    text-align: center;
    color: #9FB7BF;
    font-size: 2rem;
  }
  /* The key guide lives on the empty board (and in Settings), not in the
     top bar: nobody needs it mid-rush, and a quiet moment is when a new
     cook looks around. */
  .empty-keys { margin-top: 1.5rem; font-size: 1.3rem; color: #7F9AA3; line-height: 2.2; }

  .ticket {
    display: flex;
    flex-direction: column;
    background: var(--cream);
    border-radius: 0.5rem;
    overflow: hidden;
    box-shadow: 0 0.2rem 0.6rem rgba(0, 0, 0, 0.35);
  }
  .ticket.new { animation: arrive 1.2s ease-out 3; }
  @keyframes arrive { 50% { box-shadow: 0 0 0 0.45rem var(--amber); } }
  @media (prefers-reduced-motion: reduce) { .ticket.new { animation: none; } }
  /* NEW stays for a minute, not just the three pulses: without sound, a
     cook who was facing the grill when it arrived still has to spot it. */
  .ticket.is-fresh { outline: 0.3rem solid var(--amber); outline-offset: 0.15rem; }
  .fresh-tag {
    display: none;
    padding: 0 0.45rem;
    margin-right: 0.45rem;
    border-radius: 0.3rem;
    background: var(--amber);
    color: #1A1A1A;
    font-weight: 900;
  }
  .ticket.is-fresh .fresh-tag { display: inline-block; }
  .ticket.warn .fresh-tag, .ticket.late .fresh-tag { background: #1A1A1A; color: var(--amber); }

  /* A flash around the edge of the whole screen when an order arrives, for
     the same reason: something visible from anywhere in the kitchen. */
  .edge-flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    box-shadow: inset 0 0 0 0.9rem var(--amber);
    opacity: 0;
  }
  .edge-flash.go { animation: edge 0.9s ease-in-out 3; }
  @keyframes edge { 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .edge-flash.go { animation: edge-still 3s step-end 1; } @keyframes edge-still { 0% { opacity: 1; } 100% { opacity: 0; } } }

  .ticket header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.75rem;
    background: var(--teal);
    color: var(--cream);
  }
  .ticket.warn header { background: var(--amber); color: #1A1A1A; }
  .ticket.late header { background: var(--red); color: #fff; }
  .ticket.later header { background: #566E76; } /* cream on it is 5:1; the old #6E8890 was 3.6:1 */

  /* The ticket's number-pad key. It is the main control, so it is the
     biggest thing in the header after the name. */
  .key {
    display: grid;
    place-items: center;
    width: 2.9rem;
    height: 2.9rem;
    border-radius: 0.4rem;
    background: #fff;
    color: #1A1A1A;
    font-weight: 900;
    font-size: 2rem;
    line-height: 1;
  }
  .key:empty { display: none; }
  .who { min-width: 0; }
  .who .name { display: block; font-size: 1.25rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .kind { display: block; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; }
  .timer { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .timer small { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }

  .items { list-style: none; margin: 0; padding: 0.4rem 0.75rem 0.2rem; }
  .items > li {
    display: grid;
    grid-template-columns: 2.4rem 1fr;
    padding: 0.45rem 0;
    border-bottom: 1px solid #E3DDD3;
  }
  .items > li:last-child { border-bottom: 0; }
  .qty { font-size: 1.4rem; font-weight: 800; }
  .qty.many { color: var(--red-dark); }
  .item { font-size: 1.4rem; font-weight: 700; line-height: 1.2; }
  .variation { font-size: 1.1rem; color: var(--teal-dark); font-weight: 700; }
  .mods { margin: 0.15rem 0 0; padding: 0; list-style: none; font-size: 1.1rem; font-weight: 600; }
  .mods li::before { content: "– "; color: var(--muted); }
  .mods li.neg { color: var(--red-dark); font-weight: 700; }
  .note {
    margin-top: 0.3rem;
    padding: 0.25rem 0.5rem;
    background: #FFF0C2;
    border-left: 0.3rem solid var(--amber);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .ticket > .note { margin: 0.2rem 0.75rem 0.4rem; }
  /* Allergy notes are a food-safety matter, not a preference: red, with a
     warning sign, so they can't be read as "ranch on the side". */
  .note.allergy { background: #FBE3E1; border-left-color: var(--red); color: #7A1F18; }
  .note.allergy::before, .mods li.allergy::before { content: "\26A0  "; }
  .mods li.allergy { color: var(--red-dark); font-weight: 800; }

  /* Quiet on purpose. Six solid red buttons were the loudest thing on the
     screen, and red is kept for "late". The number pad does the bumping;
     this is the mouse's way to do the same. */
  .done {
    margin: 0.4rem 0.75rem 0.7rem;
    padding: 0.5rem;
    border: 2px solid #C9C0B2;
    border-radius: 0.4rem;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .done:hover { border-color: var(--teal); color: var(--teal-dark); }
  .done:active { background: #EAE3D7; }
</style>
</head>
<body>
  <div class="bar">
    <div class="bar-left">
      <span class="count" id="count"></span>
      <button class="undo" id="undo" type="button" hidden>↶ Undo</button>
    </div>
    <span class="clock" id="clock"></span>
    <div class="bar-right">
    <button class="icon-btn sound" id="sound" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
        <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></g>
        <g class="cross"><path d="m16 9 6 6"/><path d="m22 9-6 6"/></g>
      </svg>
    </button>
    <button class="icon-btn refresh" id="refresh" type="button" aria-label="Check Square now" title="Check Square now">
      <svg viewBox="0 0 44 44" fill="none" stroke-linecap="round" aria-hidden="true">
        <circle class="track" cx="22" cy="22" r="20" stroke-width="3"/>
        <circle class="ring" id="ring" cx="22" cy="22" r="20" stroke-width="3" stroke-dasharray="125.66" stroke-dashoffset="0"/>
        <g class="glyph-spin"><g class="glyph" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" transform="translate(9.4 9.4) scale(1.05)">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </g></g>
      </svg>
    </button>
    <div class="power-wrap">
      <button class="icon-btn power" id="power" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Board menu" title="Board menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="width:60%;height:60%">
          <path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
        </svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Settings &amp; help
        </button>
        <button type="button" role="menuitem" data-act="update">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Check for updates
        </button>
        <hr>
        <button type="button" role="menuitem" data-act="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m9 10 6 6"/><path d="m15 10-6 6"/></svg>
          Close the board
        </button>
        <button type="button" role="menuitem" data-act="restart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Restart the PC
        </button>
        <button type="button" role="menuitem" class="danger" data-act="shutdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
          Shut down the PC
        </button>
      </div>
    </div>
    </div>
  </div>
  <div class="alert" id="alert" hidden></div>
  <main class="board" id="board"></main>
  <div class="more" id="more" hidden></div>
  <div class="edge-flash" id="edge" aria-hidden="true"></div>

  <div class="scrim" id="scrim" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div>
  </div>

<script>
(() => {
  // How long before a ticket's header turns amber / red, in minutes.
  // Counter orders age from when they were rung up; pickup orders from when
  // they're due (amber when due soon, red once past due).
  const COUNTER_WARN = 8, COUNTER_LATE = 15;
  const PICKUP_WARN = 10; // minutes before due
  const POLL_MS = 1000; // this PC's own board program, not Square: cheap

  const board = document.getElementById("board");
  const alertEl = document.getElementById("alert");
  const undoBtn = document.getElementById("undo");
  const refreshBtn = document.getElementById("refresh");
  const ringEl = document.getElementById("ring");
  const RING = 125.66; // circumference of the r=20 ring
  let pollSeconds = 5;
  let nextPollAt = null;
  let checking = false;
  const moreEl = document.getElementById("more");
  const soundBtn = document.getElementById("sound");
  let soundOn = true;
  let serverSound = true; // false when started with KITCHEN_MUTE or "sound": false
  // A tap on the speaker overrides the default and is remembered on this
  // screen; null means "no tap yet, follow the server".
  let localMute = null;
  try {
    const v = localStorage.getItem("kb-muted");
    if (v === "1" || v === "0") localMute = v === "1";
  } catch {}

  function renderSound() {
    soundOn = localMute === null ? serverSound : !localMute;
    soundBtn.classList.toggle("is-muted", !soundOn);
    soundBtn.setAttribute("aria-pressed", String(!soundOn));
    const label = soundOn ? "Mute sound" : "Unmute sound";
    soundBtn.setAttribute("aria-label", label);
    soundBtn.title = label;
  }

  let tickets = [];
  let lastJson = "";
  let known = null; // ids seen so far; null until the first load
  let lastCleared = null; // {id, label} from the server: what Undo brings back
  let lastOkAt = null;
  let down = false; // currently showing a connection problem

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const label = (t) => t.name || `#${t.shortId}`;

  function mmss(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`;
  }

  // ---- timers: recomputed every second without re-rendering the cards
  function age(t, now) {
    if (t.dueAt) {
      const until = Date.parse(t.dueAt) - now;
      if (until > PICKUP_WARN * 6e4) return { cls: "later", text: fmtTime(t.dueAt), sub: "due" };
      if (until > 0) return { cls: "warn", text: mmss(until), sub: "due in" };
      return { cls: "late", text: mmss(-until), sub: "past due" };
    }
    const since = now - Date.parse(t.createdAt);
    const cls = since >= COUNTER_LATE * 6e4 ? "late" : since >= COUNTER_WARN * 6e4 ? "warn" : "";
    return { cls, text: mmss(since), sub: "waiting" };
  }

  // When each ticket first appeared on this screen, for the NEW tag. Only
  // tickets that arrive while the board is open get one: after a restart,
  // everything already up is old news.
  const FRESH_MS = 60000;
  const seenAt = new Map();

  function tick() {
    const now = Date.now();
    if (lastOkAt) {
      const s = Math.round((now - Date.parse(lastOkAt)) / 1000);
      refreshBtn.title = `Check Square now (last checked ${s < 2 ? "just now" : s + "s ago"})`;
    }
    document.getElementById("clock").textContent = new Date(now).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    for (const card of board.querySelectorAll(".ticket")) {
      const t = tickets.find((x) => x.id === card.dataset.id);
      if (!t) continue;
      const a = age(t, now);
      card.classList.remove("warn", "late", "later");
      if (a.cls) card.classList.add(a.cls);
      card.classList.toggle("is-fresh", now - (seenAt.get(t.id) || 0) < FRESH_MS);
      card.querySelector(".timer").innerHTML = `${esc(a.text)}<small>${a.sub}</small>`;
    }
  }

  // ---- rendering
  function kindLabel(t) {
    if (t.kind === "COUNTER") return "Counter";
    // Square Online is where nearly every pickup comes from, so it is just
    // "Online"; "Pickup · Square Online" wrapped to three lines on a ticket.
    // Any other source (a delivery app, say) is still named.
    if (t.kind === "PICKUP" && (!t.source || /square online/i.test(t.source))) return "Online";
    const k = t.kind === "PICKUP" ? "Pickup" : t.kind.charAt(0) + t.kind.slice(1).toLowerCase();
    return t.source ? `${k} · ${t.source}` : k;
  }

  // Notes and modifiers about an allergy or a medical diet. Broad on
  // purpose: a false alarm costs a glance, a miss costs far more.
  const ALLERGY = /allerg|anaphyla|epi-?pen|gluten|celiac|coeliac|peanut|tree ?nut|\bnuts?\b|shellfish|dairy|lactose|\begg[- ]free|\bsoy\b|sesame/i;

  function modClass(m) {
    if (ALLERGY.test(m)) return ' class="allergy"';
    return /^(no|without|hold|light|easy)\b/i.test(m) ? ' class="neg"' : "";
  }
  const noteHtml = (n) => `<div class="note${ALLERGY.test(n) ? " allergy" : ""}">${esc(n)}</div>`;

  function render(fresh) {
    if (!tickets.length) {
      board.innerHTML = `<div class="empty"><p>No open orders</p>
        <p class="empty-keys keys"><b>1</b>–<b>9</b> done &nbsp; <b>⌫</b> or <b>0</b> undo &nbsp; <b>+</b> <b>−</b> scroll &nbsp; <b>⏎</b> check Square now</p></div>`;
    } else {
      board.innerHTML = tickets.map((t, i) => `
        <article class="ticket${fresh.has(t.id) ? " new" : ""}" data-id="${esc(t.id)}">
          <header>
            <span class="key">${i < 9 ? i + 1 : ""}</span>
            <span class="who">
              <span class="name">${esc(label(t))}</span>
              <span class="kind"><span class="fresh-tag">NEW</span>${esc(kindLabel(t))}</span>
            </span>
            <span class="timer"></span>
          </header>
          <ul class="items">
            ${t.items.map((it) => `
              <li>
                <span class="qty${it.qty > 1 ? " many" : ""}">${it.qty}</span>
                <div>
                  <div class="item">${esc(it.name)}</div>
                  ${it.variation ? `<div class="variation">${esc(it.variation)}</div>` : ""}
                  ${it.mods.length ? `<ul class="mods">${it.mods.map((m) => `<li${modClass(m)}>${esc(m)}</li>`).join("")}</ul>` : ""}
                  ${it.note ? noteHtml(it.note) : ""}
                </div>
              </li>`).join("")}
          </ul>
          ${t.note ? noteHtml(t.note) : ""}
          <button class="done" type="button">Done</button>
        </article>`).join("");
    }
    const n = tickets.length;
    document.getElementById("count").textContent = n ? `${n} open` : "";
    tick();
    showMore();
  }

  const edgeEl = document.getElementById("edge");
  function flashEdge() {
    edgeEl.classList.remove("go");
    void edgeEl.offsetWidth; // restart the animation if one is still running
    edgeEl.classList.add("go");
  }

  function renderUndo() {
    undoBtn.hidden = !lastCleared;
    if (lastCleared) undoBtn.textContent = `↶ Undo ${lastCleared.label}`;
  }

  // "2 more orders below": a ticket must never sit unseen off the bottom.
  function showMore() {
    // Counts tickets that are cut off, not just ones wholly off screen: a
    // ticket whose last item is hidden is as easy to get wrong as a missing one.
    const below = [...board.querySelectorAll(".ticket")].filter(
      (c) => c.getBoundingClientRect().bottom > window.innerHeight + 2
    ).length;
    moreEl.hidden = !below;
    moreEl.textContent = `▼ ${below} order${below === 1 ? "" : "s"} continue${below === 1 ? "s" : ""} below (press +)`;
  }
  window.addEventListener("scroll", showMore, { passive: true });
  window.addEventListener("resize", showMore);

  // Show or clear the connection banner. Going from fine to broken sounds
  // the alarm once, so a dead board mid-service doesn't go unnoticed.
  // Alarms only on LOSING a connection that was working: "Connecting…" at
  // startup is not an outage and must not beep every time the PC boots.
  let wasOk = false;
  function problem(text) {
    if (text && !down && wasOk) alarm();
    if (!text) wasOk = true;
    down = !!text;
    alertEl.hidden = !text;
    if (text) alertEl.textContent = text;
  }

  // A banner that is information, not an outage (test mode): never sounds.
  function notice(text) {
    down = false;
    alertEl.hidden = false;
    alertEl.textContent = text;
  }

  function apply(data) {
    serverSound = data.sound !== false;
    renderSound();
    pollSeconds = data.pollSeconds || pollSeconds;
    nextPollAt = data.nextPollAt;
    checking = !!data.checking;
    lastOkAt = data.lastOkAt;
    lastCleared = data.lastCleared;
    renderUndo();

    // Status banner: Square unreachable, or the last good poll is stale.
    const stale = !data.lastOkAt || Date.now() - Date.parse(data.lastOkAt) > 60000;
    if (data.error || stale) {
      problem(data.lastOkAt
        ? `Can't reach Square — orders shown as of ${fmtTime(data.lastOkAt)}. Check the internet. New orders may be missing.`
        : `Connecting to Square… ${data.error ? "(" + data.error + ")" : ""}`);
    } else {
      // Test mode used to go through problem(), which sounded the alarm and
      // then reset itself, so it went off on every poll.
      if (data.mock) { wasOk = true; notice("TEST MODE — these are fake orders, not from Square."); }
      else problem(null);
    }

    const json = JSON.stringify(data.tickets);
    if (json === lastJson) return;
    lastJson = json;
    tickets = data.tickets;

    const fresh = new Set();
    if (known) for (const t of tickets) if (!known.has(t.id)) fresh.add(t.id);
    known = known || new Set();
    for (const t of tickets) known.add(t.id);
    if (fresh.size) {
      const now = Date.now();
      for (const id of fresh) seenAt.set(id, now);
      chime();
      flashEdge();
    }
    render(fresh);
  }

  async function load() {
    try {
      const res = await fetch("/api/tickets", { cache: "no-store" });
      apply(await res.json());
    } catch {
      problem("The board program isn't running. Restart the kitchen PC.");
    } finally {
      setTimeout(load, POLL_MS);
    }
  }

  async function post(path, id) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(id ? { id } : {}),
    });
    if (res.ok) apply(await res.json());
  }

  function bump(id) {
    const t = tickets.find((x) => x.id === id);
    if (!t) return;
    lastCleared = { id, label: label(t) };
    renderUndo();
    // Remove right away so the screen feels instant; the server confirms.
    tickets = tickets.filter((x) => x.id !== id);
    lastJson = "";
    render(new Set());
    post("/api/bump", id).catch(() => {});
  }

  // The server keeps what was cleared, newest first: pressing Undo again
  // keeps bringing back older tickets, and it survives a reload or restart.
  function undo() {
    post("/api/undo").catch(() => {});
  }

  async function checkNow() {
    checking = true;
    try { await post("/api/refresh"); } catch {}
    checking = false;
  }

  // The countdown ring: full right after a check, empty when the next one
  // is due. Drawn every frame so it moves smoothly rather than in steps.
  function drawRing() {
    let frac = 1;
    if (nextPollAt && !checking) {
      frac = (Date.parse(nextPollAt) - Date.now()) / (pollSeconds * 1000);
      frac = Math.max(0, Math.min(1, frac));
    }
    ringEl.style.strokeDashoffset = String(RING * (1 - frac));
    refreshBtn.classList.toggle("is-checking", checking);
    refreshBtn.classList.toggle("is-down", down);
    requestAnimationFrame(drawRing);
  }
  requestAnimationFrame(drawRing);

  function scrollPage(dir) {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollBy({ top: dir * window.innerHeight * 0.6, behavior: reduce ? "auto" : "smooth" });
  }

  board.addEventListener("click", (e) => {
    const btn = e.target.closest(".done");
    if (btn) bump(btn.closest(".ticket").dataset.id);
  });
  undoBtn.addEventListener("click", undo);
  refreshBtn.addEventListener("click", checkNow);
  soundBtn.addEventListener("click", () => {
    localMute = soundOn; // muting if it was on, unmuting if it was off
    try { localStorage.setItem("kb-muted", localMute ? "1" : "0"); } catch {}
    renderSound();
    if (soundOn) chime(); // so you hear it's back on
  });

  // ---- board menu: settings & help, updates, close, restart, shut down.
  // Mouse only, and every action that takes the board off the screen asks
  // first. Restart and shut down then count down with a big Cancel, because
  // a PC that goes off mid-lunch can't be turned back on remotely.
  const powerBtn = document.getElementById("power");
  const menuEl = document.getElementById("menu");
  const scrim = document.getElementById("scrim");
  const dialog = document.getElementById("dialog");
  const POWER_COUNTDOWN = 5; // seconds before a restart or shut down goes ahead
  let countdown = null;

  function openMenu(open) {
    menuEl.hidden = !open;
    powerBtn.classList.toggle("is-open", open);
    powerBtn.setAttribute("aria-expanded", String(open));
  }
  function closeAll() {
    clearInterval(countdown);
    countdown = null;
    openMenu(false);
    scrim.hidden = true;
    dialog.innerHTML = "";
  }
  function showDialog(html) {
    openMenu(false);
    dialog.innerHTML = html;
    scrim.hidden = false;
    const first = dialog.querySelector("[data-focus]");
    if (first) first.focus();
  }

  async function ask(path, body) {
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Kitchen-Board": "1" },
        body: JSON.stringify(body || {}),
      });
      return await res.json();
    } catch {
      return { ok: false, message: "The board program didn't answer." };
    }
  }

  function message(title, text) {
    showDialog(`<h2 id="dialog-title">${esc(title)}</h2><p>${esc(text)}</p>
      <div class="actions"><button type="button" class="primary" data-close data-focus>OK</button></div>`);
  }

  const POWER = {
    close: {
      title: "Close the board?",
      text: "The screen goes back to Windows. Orders still print. Run start-kitchen.bat to bring the board back.",
      go: "Close the board",
    },
    restart: {
      title: "Restart the kitchen PC?",
      text: "The board is off for a minute or two while Windows restarts. Orders still print.",
      go: "Restart",
      count: "Restarting in",
    },
    shutdown: {
      title: "Shut down the kitchen PC?",
      text: "Nobody can turn it back on remotely. Someone has to press its power button. Orders still print.",
      go: "Shut down",
      count: "Shutting down in",
      danger: true,
    },
  };

  async function runPower(action) {
    const r = await ask("/api/power", { action });
    if (!r.ok) message("Didn't happen", r.message || "Something went wrong.");
  }

  function confirmPower(action) {
    const p = POWER[action];
    showDialog(`<h2 id="dialog-title">${p.title}</h2><p>${p.text}</p>
      <div class="actions">
        <button type="button" data-close data-focus>Cancel</button>
        <button type="button" class="${p.danger ? "danger" : "primary"}" data-go>${p.go}</button>
      </div>`);
    dialog.querySelector("[data-go]").addEventListener("click", () => {
      if (!p.count) { closeAll(); runPower(action); return; }
      let left = POWER_COUNTDOWN;
      showDialog(`<h2 id="dialog-title">${p.count}</h2>
        <p class="count-down" id="count-left">${left}</p>
        <div class="actions"><button type="button" class="primary" data-close data-focus>Cancel</button></div>`);
      countdown = setInterval(() => {
        left -= 1;
        const el = document.getElementById("count-left");
        if (el) el.textContent = left;
        if (left <= 0) { closeAll(); runPower(action); }
      }, 1000);
    });
  }

  async function checkForUpdates() {
    showDialog(`<h2 id="dialog-title">Checking for updates…</h2><p>One moment.</p>`);
    const r = await ask("/api/update");
    if (r.restarting) {
      showDialog(`<h2 id="dialog-title">Updating</h2><p>${esc(r.message)}</p>`);
    } else {
      message(r.ok ? "Updates" : "Couldn't check", r.message || "Something went wrong.");
    }
  }

  function showSettings() {
    const last = lastOkAt ? fmtTime(lastOkAt) : "not yet";
    showDialog(`<h2 id="dialog-title">Settings &amp; help</h2>
      <div class="keys-table keys">
        <span><b>1</b>–<b>9</b></span><span>Done on that ticket</span>
        <span><b>⌫</b> <b>0</b></span><span>Undo. Press again to go further back.</span>
        <span><b>+</b> <b>−</b></span><span>Scroll down / up</span>
        <span><b>⏎</b></span><span>Check Square now</span>
      </div>
      <p>Sound is <b>${soundOn ? "on" : "off"}</b>. Tap the speaker in the top bar to change it.</p>
      <p class="meta">Checks Square every ${pollSeconds} s · last good check ${esc(last)}</p>
      <div class="actions">
        <a class="link-btn" href="/check">Order check page</a>
        <button type="button" class="primary" data-close data-focus>Close</button>
      </div>`);
  }

  powerBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu(menuEl.hidden);
  });
  menuEl.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "settings") showSettings();
    else if (act === "update") checkForUpdates();
    else if (POWER[act]) confirmPower(act);
  });
  document.addEventListener("click", (e) => {
    if (!menuEl.hidden && !e.target.closest(".power-wrap")) openMenu(false);
  });
  scrim.addEventListener("click", (e) => {
    if (e.target === scrim || e.target.closest("[data-close]")) closeAll();
  });

  // Built to run from a number pad alone (spill-resistant; the mouse is for
  // precision). Matched on e.code as well as e.key so the keys work with Num
  // Lock on or off — with it off, Numpad1 sends "End", not "1".
  //   1–9               Done on that ticket
  //   Backspace or 0    Undo (press again to go further back)
  //   − / +             scroll up / down
  //   Enter             check Square now
  document.addEventListener("keydown", (e) => {
    // With the menu or a dialog open, the number pad does nothing but
    // Escape closes it. No key can confirm a shutdown: Enter is swallowed
    // here before it reaches a focused button.
    if (!scrim.hidden || !menuEl.hidden) {
      if (e.key === "Escape" || e.key === "Backspace") closeAll();
      if (e.key !== "Tab") e.preventDefault();
      return;
    }
    if (e.repeat) return; // a key held down or leaned on fires once
    const m = /^(?:Numpad|Digit)([0-9])$/.exec(e.code) || /^([0-9])$/.exec(e.key);
    const digit = m ? Number(m[1]) : null;
    if (digit !== null && digit >= 1) {
      const t = tickets[digit - 1];
      if (t) bump(t.id);
    } else if (digit === 0 || e.key === "Backspace") {
      undo();
    } else if (e.code === "NumpadAdd" || e.key === "+" || e.key === "=") {
      scrollPage(1);
    } else if (e.code === "NumpadSubtract" || e.key === "-") {
      scrollPage(-1);
    } else if (e.key === "Enter") {
      checkNow();
    } else {
      return;
    }
    e.preventDefault();
  });

  // ---- new-order chime (Chrome is launched with autoplay allowed; the
  // first tap anywhere also unlocks audio, in case it wasn't)
  let audio;
  function chime() {
    if (!soundOn) return;
    try {
      audio = audio || new AudioContext();
      if (audio.state === "suspended") audio.resume();
      [880, 1175].forEach((freq, i) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        const t0 = audio.currentTime + i * 0.22;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        o.connect(g).connect(audio.destination);
        o.start(t0);
        o.stop(t0 + 0.4);
      });
    } catch {}
  }
  // A low falling tone when the board loses Square or its own program,
  // distinct from the new-order chime so nobody mistakes it for an order.
  function alarm() {
    if (!soundOn) return;
    try {
      audio = audio || new AudioContext();
      if (audio.state === "suspended") audio.resume();
      [440, 330, 220].forEach((freq, i) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        const t0 = audio.currentTime + i * 0.3;
        o.type = "square";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
        o.connect(g).connect(audio.destination);
        o.start(t0);
        o.stop(t0 + 0.3);
      });
    } catch {}
  }
  document.addEventListener("pointerdown", () => {
    try { audio = audio || new AudioContext(); audio.resume(); } catch {}
  }, { once: true });

  // ---- kiosk niceties: keep the screen awake, hide an idle mouse pointer
  async function wake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch {}
  }
  wake();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });

  let idleTimer;
  document.addEventListener("pointermove", () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 4000);
  });

  setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
