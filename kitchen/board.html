<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Orders</title>
<link rel="stylesheet" href="/kitchen.css">
<style>
  /* Sizes scale with the screen like /menu-board. Colours are in kitchen.css. */
  html { font-size: clamp(14px, 1.15vw, 26px); }
  body {
    background: var(--ground);
    -webkit-user-select: none;
    user-select: none;
  }
  body.idle { cursor: none; }

  /* Three zones: order count and Undo on the left, the clock dead centre
     (where a glance from the line finds it), status and the power menu on
     the right. The outer columns are equal so the clock never drifts off
     centre when Undo appears or the count changes. */
  .bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1.25rem;
    padding: 0.5rem 1.25rem;
    background: var(--teal-dark);
    color: var(--cream);
  }
  .bar-left, .bar-right { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .bar-right { justify-content: flex-end; gap: 0.6rem; }
  .bar .count { font-size: 1.4rem; font-weight: 700; white-space: nowrap; }
  .bar .count .today { opacity: 0.8; }
  .bar .clock { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 2.8rem;
    height: 2.8rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--cream);
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .icon-btn:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .icon-btn svg { width: 100%; height: 100%; overflow: visible; }

  /* Muted is a filled cream button, not just a different icon: a silent
     board in a loud kitchen should be noticeable from across the room.
     Not amber: amber on the board means time and nothing else. */
  .sound .waves { display: inline; }
  .sound .cross { display: none; }
  .sound.is-muted, .sound.is-muted:hover { background: var(--cream); color: var(--teal-dark); }
  .sound.is-muted .waves { display: none; }
  .sound.is-muted .cross { display: inline; }

  /* The refresh button's ring empties as the next Square check approaches,
     then refills when it runs. Amber when Square can't be reached. */
  .refresh .track { stroke: rgba(250, 247, 242, 0.22); }
  .refresh .ring { stroke: var(--mint); transform: rotate(-90deg); transform-origin: 22px 22px; }
  .refresh.is-down .ring { stroke: var(--alarm-light); }
  .refresh.is-checking svg .glyph-spin { animation: spin 0.8s linear infinite; transform-origin: 22px 22px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh.is-checking svg .glyph-spin { animation: none; opacity: 0.6; } }
  .undo {
    font: inherit;
    font-size: 1rem;
    padding: 0.45rem 1rem;
    border: 2px solid var(--cream);
    border-radius: 0.4rem;
    background: transparent;
    color: var(--cream);
    cursor: pointer;
  }
  .undo[hidden] { display: none; }
  .undo-wrap { position: relative; }
  .undo-wrap[hidden] { display: none; }
  /* The Undo list: every ticket cleared today, newest first, so the mouse
     can bring back the one it wants instead of stepping back one at a time.
     Backspace / 0 on the number pad still steps back one at a time. */
  .undo-menu { left: 0; right: auto; min-width: 34rem; max-height: 70vh; overflow-y: auto; }
  .undo-menu button > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .undo-menu .when { margin-left: auto; font-weight: 600; color: var(--muted); font-size: 1rem; white-space: nowrap; }
  .undo-menu .main { font-weight: 600; color: var(--muted); }
  .undo-menu .empty-note { padding: 0.75rem 0.9rem; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 0 0 1rem; }
  .stat { background: #EFE9DE; border-radius: 0.4rem; padding: 0.5rem 0.7rem; }
  .stat b { display: block; font-size: 1.8rem; line-height: 1.1; }
  .stat span { font-size: 0.95rem; color: var(--muted); }
  .dialog .top-items { font-size: 1.05rem; margin: -0.4rem 0 1rem; color: var(--muted); }

  .keys b { display: inline-block; min-width: 1.6em; padding: 0 0.3em; border: 2px solid currentColor; border-radius: 0.3rem; text-align: center; font-weight: 800; }

  /* ---- power menu (mouse only: no number-pad key opens or confirms it) */
  .power-wrap { position: relative; }
  .power.is-open { background: rgba(255, 255, 255, 0.16); }
  .menu {
    position: absolute;
    right: 0;
    top: calc(100% + 0.5rem);
    z-index: 20;
    min-width: 17rem;
    padding: 0.4rem;
    background: var(--cream);
    border-radius: 0.5rem;
    box-shadow: 0 0.4rem 1.4rem rgba(0, 0, 0, 0.5);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
    padding: 0.75rem 0.9rem;
    border: 0;
    border-radius: 0.35rem;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: #EAE3D7; outline: none; }
  .menu svg { width: 1.4rem; height: 1.4rem; flex: none; }
  .menu hr { border: 0; border-top: 1px solid #DDD5C8; margin: 0.3rem 0.4rem; }
  .menu .danger { color: var(--red-dark); }

  /* ---- dialogs: settings & help, and every power action's confirmation */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: rgba(10, 25, 30, 0.75);
  }
  .scrim[hidden] { display: none; }
  .dialog {
    width: min(40rem, 90vw);
    padding: 1.6rem 1.8rem;
    background: var(--cream);
    color: var(--text);
    border-radius: 0.6rem;
    box-shadow: 0 0.6rem 2rem rgba(0, 0, 0, 0.6);
  }
  .dialog h2 { margin: 0 0 0.6rem; font-size: 1.8rem; }
  .dialog p { margin: 0 0 1rem; font-size: 1.25rem; line-height: 1.4; }
  .dialog .count-down { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red-dark); }
  .dialog .actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.2rem; }
  .dialog .actions button, .dialog .link-btn {
    font: inherit;
    font-size: 1.25rem;
    font-weight: 800;
    padding: 0.75rem 1.4rem;
    border-radius: 0.4rem;
    border: 2px solid var(--teal);
    background: transparent;
    color: var(--teal-dark);
    cursor: pointer;
    text-decoration: none;
  }
  .dialog .actions .primary { background: var(--teal); color: var(--cream); }
  .dialog .actions .danger { background: var(--red); border-color: var(--red); color: #fff; }
  .dialog .keys-table { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem 1rem; align-items: center; margin: 0 0 1.2rem; font-size: 1.25rem; }
  .dialog .meta { font-size: 1.05rem; color: var(--muted); }
  .dialog .check { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 1.2rem; margin: 0 0 0.6rem; cursor: pointer; }
  .dialog .check input { width: 1.4rem; height: 1.4rem; margin-top: 0.15rem; flex: none; }
  .more {
    position: fixed;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    padding: 0.6rem 1.4rem;
    border-radius: 2rem;
    background: var(--cream);
    color: var(--teal-dark);
    font-size: 1.2rem;
    font-weight: 800;
    box-shadow: 0 0.2rem 0.8rem rgba(0, 0, 0, 0.5);
  }
  .more[hidden] { display: none; }

  /* WAIT UNTIL: orders that go on the board later (a pickup or phone order
     due in more than 15 min, a DoorDash order waiting for its Dasher),
     along the bottom, small and dim, so nobody starts them early. No key:
     they can't be cleared until they're up. */
  .waiting {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 0.8rem;
    align-items: stretch;
    padding: 0.6rem 1.25rem;
    background: var(--teal-dark);
    border-top: 0.15rem solid #9FB7BF;
    overflow: hidden;
  }
  .waiting[hidden] { display: none; }
  .waiting .w-head { flex: none; align-self: center; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; color: #9FB7BF; }
  .waiting .w-card { flex: 0 1 22rem; min-width: 14rem; padding: 0.45rem 0.8rem; border-radius: 0.4rem; background: #2E5562; color: var(--cream); }
  .waiting .w-until { font-size: 1.25rem; font-weight: 800; }
  .waiting .w-until small { font-weight: 600; font-size: 0.95rem; color: #CFE0E4; margin-left: 0.35rem; }
  .waiting .w-who { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .waiting .w-who span { font-weight: 400; color: #CFE0E4; margin-left: 0.4rem; }
  .waiting .w-items { font-size: 1rem; color: #CFE0E4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* A problem (Square or the program lost) is red; test mode and the demo
     are the practice purple. Neither is amber, which means time. */
  .alert {
    padding: 0.7rem 1.25rem;
    background: var(--red-dark);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .alert[hidden] { display: none; }

  /* Reservations: a table coming up (within reservationAheadMinutes) is a
     cream row under the bar, big enough to read from the line; amber from
     15 minutes before its time to the end of the hold, as amber means time.
     The rest of today's tables are one quiet line. Seated is pressed on the
     front page; the row goes then, or when the hold runs out. */
  .resv { display: grid; gap: 0.35rem; padding: 0.45rem 1.25rem; background: var(--teal); }
  .resv[hidden] { display: none; }
  .resv-item { display: flex; align-items: baseline; gap: 1.2rem; padding: 0.35rem 0.9rem; border-radius: 0.4rem; background: var(--cream); color: var(--text); font-size: 1.35rem; }
  .resv-item.now { background: var(--amber); color: #1A1A1A; }
  .resv-item b { font-size: 1.5rem; }
  .resv-item .notes { color: inherit; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .resv-item .when { margin-left: auto; font-weight: 800; white-space: nowrap; }
  .resv-line { margin: 0; color: var(--cream); font-size: 1.1rem; }

  .board {
    display: grid;
    /* Four across at 1920 wide, kept for the cooks who don't see well
       (client 2026-10-13; five fitted nine tickets, but smaller). The slim
       Done is what buys the room. */
    grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
    gap: 1rem;
    align-items: start;
    padding: 1rem 1.25rem 2rem;
  }
  /* A number whose ticket was cleared keeps its place on the board, so
     nobody else's ticket moves into it (client 2026-10-19). The next new
     order fills it. Faint, so it never reads as an order. */
  .slot-free {
    display: grid;
    place-items: center;
    height: 4rem;
    border: 0.15rem dashed #3E5961;
    border-radius: 0.5rem;
    color: #5F7880;
    font-size: 1.6rem;
    font-weight: 900;
  }
  .empty {
    grid-column: 1 / -1;
    margin-top: 18vh;
    text-align: center;
    color: #9FB7BF;
    font-size: 2rem;
  }
  /* The key guide lives on the empty board (and in Settings), not in the
     top bar: nobody needs it mid-rush, and a quiet moment is when a new
     cook looks around. */
  .empty-keys { margin-top: 1.5rem; font-size: 1.3rem; color: #7F9AA3; line-height: 2.2; }

  .ticket {
    display: flex;
    flex-direction: column;
    background: var(--cream);
    border-radius: 0.5rem;
    overflow: hidden;
    box-shadow: 0 0.2rem 0.6rem rgba(0, 0, 0, 0.35);
  }
  .ticket.new { animation: arrive 1.2s ease-out 3; }
  @keyframes arrive { 50% { box-shadow: 0 0 0 0.45rem var(--new); } }
  @media (prefers-reduced-motion: reduce) { .ticket.new { animation: none; } }
  /* NEW stays for a minute, not just the three pulses: without sound, a
     cook who was facing the grill when it arrived still has to spot it.
     Mint, never amber: a cook must tell "new" from "getting late". */
  .ticket.is-fresh { outline: 0.3rem solid var(--new); outline-offset: 0.15rem; }
  .fresh-tag {
    display: none;
    padding: 0 0.45rem;
    margin-right: 0.45rem;
    border-radius: 0.3rem;
    background: var(--new);
    color: #0E2A33;
    font-weight: 900;
  }
  .ticket.is-fresh .fresh-tag { display: inline-block; }
  /* Practice tickets from Settings → Demo. Dashed and tagged, so a real
     order arriving mid-training is never mistaken for one. */
  .demo-tag {
    display: inline-block;
    padding: 0 0.45rem;
    margin-right: 0.45rem;
    border-radius: 0.3rem;
    background: #fff;
    color: #5B2A86;
    font-weight: 900;
  }
  .ticket.demo { outline: 0.25rem dashed #B48BD6; outline-offset: 0.1rem; }
  .alert.practice { background: #E7D9F3; color: #3D1A5C; }
  /* On an amber or red header the tag keeps its mint, with a dark edge. */
  .ticket.warn .fresh-tag, .ticket.late .fresh-tag { box-shadow: inset 0 0 0 0.12rem #0E2A33; }
  /* To go or for here, on every ticket: solid for to go (it needs boxing),
     outlined for here. Readable on every header color. */
  .dining {
    display: inline-block;
    padding: 0 0.45rem;
    margin-right: 0.45rem;
    border-radius: 0.3rem;
    background: #fff;
    color: #1A1A1A;
    font-weight: 900;
  }
  .dining, .unpaid-tag, .test-tag, .demo-tag, .fresh-tag { white-space: nowrap; }
  .dining.here { background: transparent; color: inherit; box-shadow: inset 0 0 0 0.12rem currentColor; }
  /* Not paid yet: cook it anyway (pay-later orders wait in the warmer).
     Only the front needs to act, so it's a quiet tag, not an alarm. */
  .unpaid-tag, .test-tag {
    display: inline-block;
    padding: 0 0.45rem;
    margin-right: 0.45rem;
    border-radius: 0.3rem;
    background: #1A1A1A;
    color: #fff;
    font-weight: 900;
  }
  .test-tag { background: #DDE3E6; color: #1A1A1A; }
  /* One of two or more orders rung under the same table number: send them
     out together. Beside the name, so it reads as part of "Table 5". */
  .table-tag {
    display: inline-block;
    padding: 0 0.45rem;
    margin-left: 0.5rem;
    border-radius: 0.3rem;
    background: #fff;
    color: #1A1A1A;
    font-size: 0.9em;
    font-weight: 900;
    white-space: nowrap;
  }

  /* A flash around the edge of the whole screen when an order arrives, for
     the same reason: something visible from anywhere in the kitchen. */
  .edge-flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    box-shadow: inset 0 0 0 0.9rem var(--new);
    opacity: 0;
  }
  .edge-flash.go { animation: edge 0.9s ease-in-out 3; }
  @keyframes edge { 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .edge-flash.go { animation: edge-still 3s step-end 1; } @keyframes edge-still { 0% { opacity: 1; } 100% { opacity: 0; } } }

  .ticket header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.75rem;
    background: var(--teal);
    color: var(--cream);
  }
  .ticket.warn header { background: var(--amber); color: #1A1A1A; }
  .ticket.late header { background: var(--red); color: #fff; }
  .ticket.later header { background: #566E76; } /* cream on it is 5:1; the old #6E8890 was 3.6:1 */

  /* The ticket's number-pad key. It is the main control, so it is the
     biggest thing in the header after the name. */
  .key {
    display: grid;
    place-items: center;
    width: 2.9rem;
    height: 2.9rem;
    border-radius: 0.4rem;
    background: #fff;
    color: #1A1A1A;
    font-weight: 900;
    font-size: 2rem;
    line-height: 1;
  }
  .key:empty { display: none; }
  .who { min-width: 0; }
  .who .name { display: block; font-size: 1.25rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .kind { display: block; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; }
  .timer { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .timer .pre { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; margin-right: 0.2rem; }
  .timer small { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }

  .items { list-style: none; margin: 0; padding: 0.4rem 0.75rem 0.2rem; }
  .items > li {
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    padding: 0.45rem 0;
    border-bottom: 1px solid #E3DDD3;
  }
  .items > li:last-child { border-bottom: 0; }
  /* Items to go on a For Here ticket: last, under their own line. */
  .items > li.togo-split {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0 0.15rem;
    border-top: 0.15rem dashed var(--teal-dark);
    border-bottom: 0;
    font-size: 1rem;
    font-weight: 700;
    color: var(--teal-dark);
  }
  .items > li.togo-split .dining { background: var(--teal-dark); color: var(--cream); margin: 0; }
  .qty { font-size: 1.4rem; font-weight: 800; }
  /* More than one of an item: "2×" in a red block, hard to miss. */
  .qty.many {
    justify-self: start;
    align-self: start;
    padding: 0 0.3rem;
    border-radius: 0.3rem;
    background: var(--red-dark);
    color: #fff;
  }
  .item { font-size: 1.4rem; font-weight: 700; line-height: 1.2; }
  .variation { font-size: 1.1rem; color: var(--teal-dark); font-weight: 700; }
  /* Not the usual meat (chicken on a burger, beef on the Cordon Bleu). */
  .variation.swap {
    display: inline-block;
    margin-top: 0.15rem;
    padding: 0.05rem 0.45rem;
    border-radius: 0.3rem;
    background: var(--red-dark);
    color: #fff;
    font-size: 1.2rem;
    text-transform: uppercase;
  }
  .variation.swap small { font-size: 0.85rem; font-weight: 700; text-transform: none; opacity: 0.9; }
  .mods { margin: 0.15rem 0 0; padding: 0; list-style: none; font-size: 1.1rem; font-weight: 600; }
  .mods li::before { content: "– "; color: var(--muted); }
  .mods li.neg { color: var(--red-dark); font-weight: 700; }
  .note {
    margin-top: 0.3rem;
    padding: 0.25rem 0.5rem;
    background: #FFF0C2;
    border-left: 0.3rem solid var(--amber);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .ticket > .note { margin: 0.2rem 0.75rem 0.4rem; }
  /* Allergy notes are a food-safety matter, not a preference: red, with a
     warning sign, so they can't be read as "ranch on the side". */
  .note.allergy { background: #FBE3E1; border-left-color: var(--red); color: #7A1F18; }
  .note.allergy::before, .mods li.allergy::before { content: "\26A0  "; }
  .mods li.allergy { color: var(--red-dark); font-weight: 800; }

  /* Quiet on purpose. Six solid red buttons were the loudest thing on the
     screen, and red is kept for "late". The number pad does the bumping;
     this is the mouse's way to do the same. */
  /* Slim (2026-10-12): the number pad bumps, so a full-size button on every
     ticket mostly took room another ticket could use. */
  .done {
    margin: 0.15rem 0.75rem 0.45rem;
    padding: 0.15rem;
    border: 1.5px solid #C9C0B2;
    border-radius: 0.4rem;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .done:hover { border-color: var(--teal); color: var(--teal-dark); }
  .done:active { background: #EAE3D7; }
</style>
</head>
<body>
  <div class="bar">
    <div class="bar-left">
      <span class="count" id="count"></span>
      <div class="undo-wrap" id="undo-wrap" hidden>
        <button class="undo" id="undo" type="button" aria-haspopup="menu" aria-expanded="false">↶ Undo</button>
        <div class="menu undo-menu" id="undo-menu" role="menu" hidden></div>
      </div>
    </div>
    <span class="clock" id="clock"></span>
    <div class="bar-right">
    <button class="icon-btn sound" id="sound" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
        <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></g>
        <g class="cross"><path d="m16 9 6 6"/><path d="m22 9-6 6"/></g>
      </svg>
    </button>
    <button class="icon-btn refresh" id="refresh" type="button" aria-label="Check Square now" title="Check Square now">
      <svg viewBox="0 0 44 44" fill="none" stroke-linecap="round" aria-hidden="true">
        <circle class="track" cx="22" cy="22" r="20" stroke-width="3"/>
        <circle class="ring" id="ring" cx="22" cy="22" r="20" stroke-width="3" stroke-dasharray="125.66" stroke-dashoffset="0"/>
        <g class="glyph-spin"><g class="glyph" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" transform="translate(9.4 9.4) scale(1.05)">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </g></g>
      </svg>
    </button>
    <div class="power-wrap">
      <button class="icon-btn power" id="power" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Board menu" title="Board menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="width:60%;height:60%">
          <path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
        </svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Settings &amp; help
        </button>
        <button type="button" role="menuitem" data-act="update">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Check for updates
        </button>
        <hr>
        <button type="button" role="menuitem" data-act="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m9 10 6 6"/><path d="m15 10-6 6"/></svg>
          Close the board
        </button>
        <button type="button" role="menuitem" data-act="restart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Restart the PC
        </button>
        <button type="button" role="menuitem" class="danger" data-act="shutdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
          Shut down the PC
        </button>
      </div>
    </div>
    </div>
  </div>
  <div class="alert" id="alert" hidden></div>
  <section class="resv" id="resv" aria-label="Reservations today" hidden></section>
  <main class="board" id="board"></main>
  <div class="more" id="more" hidden></div>
  <section class="waiting" id="waiting" hidden aria-label="Waiting: on the board later"></section>
  <div class="edge-flash" id="edge" aria-hidden="true"></div>

  <div class="scrim" id="scrim" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div>
  </div>

<script>
(() => {
  // How long before a ticket's header turns amber / red, in minutes.
  // Counter orders age from when they were rung up; pickup orders from when
  // they're due (amber when due soon, red once past due).
  const COUNTER_WARN = 8, COUNTER_LATE = 15;
  const PICKUP_WARN = 10; // minutes before due
  const POLL_MS = 1000; // this PC's own board program, not Square: cheap

  const board = document.getElementById("board");
  const alertEl = document.getElementById("alert");
  const undoBtn = document.getElementById("undo");
  const refreshBtn = document.getElementById("refresh");
  const ringEl = document.getElementById("ring");
  const RING = 125.66; // circumference of the r=20 ring
  let pollSeconds = 5;
  let nextPollAt = null;
  let checking = false;
  const moreEl = document.getElementById("more");
  const soundBtn = document.getElementById("sound");
  let soundOn = true;
  let serverSound = true; // false when started with KITCHEN_MUTE or "sound": false
  // A tap on the speaker overrides the default and is remembered on this
  // screen; null means "no tap yet, follow the server".
  let localMute = null;
  try {
    const v = localStorage.getItem("kb-muted");
    if (v === "1" || v === "0") localMute = v === "1";
  } catch {}

  function renderSound() {
    soundOn = localMute === null ? serverSound : !localMute;
    soundBtn.classList.toggle("is-muted", !soundOn);
    soundBtn.setAttribute("aria-pressed", String(!soundOn));
    const label = soundOn ? "Mute sound" : "Unmute sound";
    soundBtn.setAttribute("aria-label", label);
    soundBtn.title = label;
  }

  let tickets = [];
  let lastJson = "";
  let known = null; // ids seen so far; null until the first load
  let lastCleared = null; // {id, label} from the server: what Undo brings back
  let clearedList = []; // everything Undo can bring back, newest first
  let stats = null; // the day so far, from the server
  let demo = null; // { startedAt, until } while practice orders are showing

  // STABLE NUMBERS AND PLACES. A ticket keeps its number key from the
  // moment it arrives until it's done, and the number is its place on the
  // board: when 2 is cleared, 1 and 3 stay exactly where they are and 2's
  // spot sits empty (client 2026-10-19). A cook working on 3 who looks back
  // must find it where it was, with 3 on it, and pressing 3 must still clear
  // it. A new order takes the lowest free number, and so the first gap.
  // Remembered on this screen, so a reload keeps them.
  let slots = {};
  try { slots = JSON.parse(localStorage.getItem("kb-slots") || "{}"); } catch {}
  function assignSlots() {
    const ids = new Set(tickets.map((t) => t.id));
    for (const id of Object.keys(slots)) if (!ids.has(id)) delete slots[id];
    const used = new Set(Object.values(slots));
    for (const t of tickets) {
      if (slots[t.id]) continue;
      let n = 1;
      while (used.has(n) && n <= 9) n++;
      if (n > 9) continue; // no free key: it gets one when one frees up
      slots[t.id] = n;
      used.add(n);
    }
    try { localStorage.setItem("kb-slots", JSON.stringify(slots)); } catch {}
  }
  let lastOkAt = null;
  let down = false; // currently showing a connection problem

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const label = (t) => t.label || t.name || `#${t.shortId}`;
  // "10:13", for the timer: the board's clock already says AM or PM.
  const clock = (iso) => fmtTime(iso).replace(/\s?[AP]M$/i, "");

  function mmss(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`;
  }

  // ---- timers: recomputed every second without re-rendering the cards
  function age(t, now) {
    // Plates out, the to-go part still to make: not timed, it comes later.
    if (t.platesDone) return { cls: "later", text: "To go", sub: `plates out ${clock(t.platesDone)}` };
    if (t.dueAt) {
      const until = Date.parse(t.dueAt) - now;
      // The time it's due, not a countdown: a countdown looked just like a
      // counter ticket's count up ("7:50" due in vs "17:09" waiting).
      const text = clock(t.dueAt);
      const m = Math.ceil(until / 6e4);
      if (until > PICKUP_WARN * 6e4) return { cls: "later", pre: "Due", text, sub: `in ${m} min` };
      if (until > 0) return { cls: "warn", pre: "Due", text, sub: `in ${m} min` };
      const over = Math.floor(-until / 6e4);
      return { cls: "late", pre: "Due", text, sub: over < 1 ? "now" : `${over} min late` };
    }
    const since = now - Date.parse(t.createdAt);
    const cls = since >= COUNTER_LATE * 6e4 ? "late" : since >= COUNTER_WARN * 6e4 ? "warn" : "";
    return { cls, text: mmss(since), sub: "waiting" };
  }

  // When each ticket first appeared on this screen, for the NEW tag. Only
  // tickets that arrive while the board is open get one: after a restart,
  // everything already up is old news.
  const FRESH_MS = 60000;
  const seenAt = new Map();

  function tick() {
    const now = Date.now();
    // Reload for an update once the screen's been left alone a moment, with
    // no menu or dialog open and nothing waiting to be sent.
    if (pageStale && !queued.length && scrim.hidden && menuEl.hidden && undoMenu.hidden && now - lastTouch > 8000) {
      location.reload();
      return;
    }
    if (lastOkAt) {
      const s = Math.round((now - Date.parse(lastOkAt)) / 1000);
      refreshBtn.title = `Check Square now (last checked ${s < 2 ? "just now" : s + "s ago"})`;
    }
    document.getElementById("clock").textContent = new Date(now).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    for (const card of board.querySelectorAll(".ticket")) {
      const t = tickets.find((x) => x.id === card.dataset.id);
      if (!t) continue;
      const a = age(t, now);
      card.classList.remove("warn", "late", "later");
      if (a.cls) card.classList.add(a.cls);
      card.classList.toggle("is-fresh", now - (seenAt.get(t.id) || 0) < FRESH_MS);
      card.querySelector(".timer").innerHTML = `${a.pre ? `<span class="pre">${a.pre}</span>` : ""}${esc(a.text)}<small>${a.sub}</small>`;
    }
  }

  // ---- rendering
  // Counter is most tickets, so it goes unsaid: only Online and DoorDash
  // (and any other app) are named.
  function kindLabel(t) {
    if (t.kind === "COUNTER") return "";
    // Square Online is where nearly every pickup comes from, so it is just
    // "Online"; "Pickup · Square Online" wrapped to three lines on a ticket.
    // Any other source (a delivery app, say) is still named.
    // Square Online's orders are named "Ordering Profile - Web" by Square
    // (2026-10-12); a delivery app is called by its own name ("DoorDash").
    if (t.kind === "PICKUP" && (!t.source || /square online|ordering profile/i.test(t.source))) return "Online";
    if (/doordash|uber ?eats|grubhub/i.test(t.source || "")) return t.source;
    const k = t.kind === "PICKUP" ? "Pickup" : t.kind.charAt(0) + t.kind.slice(1).toLowerCase();
    return t.source ? `${k} · ${t.source}` : k;
  }

  // Notes and modifiers about an allergy or a medical diet. Broad on
  // purpose: a false alarm costs a glance, a miss costs far more.
  const ALLERGY = /allerg|anaphyla|epi-?pen|gluten|celiac|coeliac|peanut|tree ?nut|\bnuts?\b|shellfish|dairy|lactose|\begg[- ]free|\bsoy\b|sesame/i;

  function modClass(m) {
    if (ALLERGY.test(m)) return ' class="allergy"';
    return /^(no|without|hold|light|easy)\b/i.test(m) ? ' class="neg"' : "";
  }
  const noteHtml = (n) => `<div class="note${ALLERGY.test(n) ? " allergy" : ""}">${esc(n)}</div>`;

  // Top bar: what's on the board now, and today's orders so far (the same
  // count as Settings' "orders today").
  function renderCount() {
    const n = tickets.length;
    const today = stats ? stats.orders : 0;
    document.getElementById("count").innerHTML = [n ? `${n} open` : "", today ? `<span class="today">${today} today</span>` : ""].filter(Boolean).join(" · ");
  }

  function render(fresh) {
    if (!tickets.length) {
      board.innerHTML = `<div class="empty"><p>No open orders</p>
        <p class="empty-keys keys"><b>1</b>–<b>9</b> done &nbsp; <b>⌫</b> or <b>0</b> undo &nbsp; <b>+</b> <b>−</b> scroll &nbsp; <b>⏎</b> check Square now</p></div>`;
    } else {
      assignSlots();
      // Numbered tickets in their number's place, a gap for each free number
      // before the last one used, then any without a number (more than nine).
      const bySlot = new Map(tickets.filter((t) => slots[t.id]).map((t) => [slots[t.id], t]));
      const top = Math.max(0, ...bySlot.keys());
      const cells = [];
      for (let n = 1; n <= top; n++) cells.push(bySlot.get(n) || n);
      for (const t of tickets) if (!slots[t.id]) cells.push(t);
      board.innerHTML = cells.map((t) => typeof t === "number"
        ? `<div class="slot-free" aria-hidden="true">${t}</div>`
        : `
        <article class="ticket${fresh.has(t.id) ? " new" : ""}${t.demo ? " demo" : ""}" data-id="${esc(t.id)}">
          <header>
            <span class="key">${slots[t.id] || ""}</span>
            <span class="who">
              <span class="name">${esc(label(t))}${t.tableOf ? `<span class="table-tag">${t.tableOf.n} of ${t.tableOf.of}</span>` : ""}</span>
              <span class="kind">${t.demo ? '<span class="demo-tag">DEMO</span>' : ""}<span class="fresh-tag">NEW</span>${t.test ? '<span class="test-tag">TEST</span>' : ""}${t.unpaid ? '<span class="unpaid-tag">NOT PAID</span>' : ""}${t.toGo ? '<span class="dining">TO GO</span>' : '<span class="dining here">FOR HERE</span>'}${esc(kindLabel(t))}</span>
            </span>
            <span class="timer"></span>
          </header>
          <ul class="items">
            ${(t.platesDone ? t.items.filter((it) => it.toGo) : t.items).map((it, i, list) => `${it.toGo && !(list[i - 1] || {}).toGo ? `<li class="togo-split"><span class="dining">TO GO</span> ${t.platesDone ? "plates are out; these to go" : "make these to go"}</li>` : ""}
              <li>
                <span class="qty${it.qty > 1 ? " many" : ""}">${it.qty > 1 ? `${it.qty}×` : it.qty}</span>
                <div>
                  <div class="item">${esc(it.name)}</div>
                  ${it.variation ? it.insteadOf ? `<div class="variation swap">${esc(it.variation)} <small>not ${esc(it.insteadOf.toLowerCase())}</small></div>` : `<div class="variation">${esc(it.variation)}</div>` : ""}
                  ${it.mods.length ? `<ul class="mods">${it.mods.map((m) => `<li${modClass(m)}>${esc(m)}</li>`).join("")}</ul>` : ""}
                  ${it.note ? noteHtml(it.note) : ""}
                </div>
              </li>`).join("")}
          </ul>
          ${t.note ? noteHtml(t.note) : ""}
          <button class="done" type="button">${!t.platesDone && t.items.some((it) => it.toGo) ? "Plates done" : "Done"}</button>
        </article>`).join("");
    }
    renderCount();
    tick();
    showMore();
  }

  // ---- the WAIT UNTIL row
  const waitingEl = document.getElementById("waiting");
  let lastWaiting = "";
  function renderWaiting(list) {
    const json = JSON.stringify(list.map((t) => [t.id, t.waitUntil, t.holdUntil, t.items.length]));
    if (json === lastWaiting) return;
    lastWaiting = json;
    waitingEl.hidden = !list.length;
    waitingEl.innerHTML = list.length ? `<span class="w-head">WAIT<br>UNTIL</span>` + list.map((t) => `
      <div class="w-card">
        <div class="w-until">${esc(clock(t.waitUntil))}${t.holdUntil ? "<small>or a Dasher</small>" : t.dueAt ? `<small>due ${esc(clock(t.dueAt))}</small>` : ""}</div>
        <div class="w-who">${esc(label(t))}${(kindLabel(t) || "Counter") !== label(t) ? `<span>${esc(kindLabel(t) || "Counter")}</span>` : ""}</div>
        <div class="w-items">${t.items.map((it) => `${it.qty > 1 ? `${it.qty}×` : it.qty} ${esc(it.name)}${it.insteadOf ? ` (${esc(it.variation)})` : ""}`).join(" · ")}</div>
      </div>`).join("") : "";
    board.style.paddingBottom = list.length ? `calc(${waitingEl.offsetHeight}px + 2rem)` : "";
    showMore();
  }

  const edgeEl = document.getElementById("edge");
  function flashEdge() {
    edgeEl.classList.remove("go");
    void edgeEl.offsetWidth; // restart the animation if one is still running
    edgeEl.classList.add("go");
  }

  const undoWrap = document.getElementById("undo-wrap");
  const undoMenu = document.getElementById("undo-menu");
  const ago = (iso) => {
    const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 6e4));
    return m ? `${m} min ago` : "just now";
  };
  function renderUndo() {
    undoWrap.hidden = !lastCleared;
    if (lastCleared) undoBtn.textContent = `↶ Undo ${lastCleared.label}`;
    if (!undoMenu.hidden) renderUndoMenu();
  }
  function renderUndoMenu() {
    undoMenu.innerHTML = clearedList.length
      ? clearedList.map((c) => `<button type="button" role="menuitem" data-unbump="${esc(c.id)}">
          <span>${esc(c.label)}${c.main ? ` <span class="main">· ${esc(c.main)}</span>` : ""}</span>
          <span class="when">${ago(c.at)}</span></button>`).join("")
      : `<div class="empty-note">Nothing to bring back.</div>`;
  }
  function openUndoMenu(open) {
    if (open) renderUndoMenu();
    undoMenu.hidden = !open;
    undoBtn.setAttribute("aria-expanded", String(open));
  }

  // "2 more orders below": a ticket must never sit unseen off the bottom.
  function showMore() {
    // Counts tickets that are cut off, not just ones wholly off screen: a
    // ticket whose last item is hidden is as easy to get wrong as a missing one.
    const floor = waitingEl.hidden ? window.innerHeight : waitingEl.getBoundingClientRect().top;
    const below = [...board.querySelectorAll(".ticket")].filter(
      (c) => c.getBoundingClientRect().bottom > floor + 2
    ).length;
    moreEl.style.bottom = waitingEl.hidden ? "" : `calc(${window.innerHeight - floor}px + 1rem)`;
    moreEl.hidden = !below;
    moreEl.textContent = `▼ ${below} order${below === 1 ? "" : "s"} continue${below === 1 ? "s" : ""} below (press +)`;
  }
  window.addEventListener("scroll", showMore, { passive: true });
  window.addEventListener("resize", showMore);

  // Show or clear the connection banner. Going from fine to broken sounds
  // the alarm once, so a dead board mid-service doesn't go unnoticed.
  // Alarms only on LOSING a connection that was working: "Connecting…" at
  // startup is not an outage and must not beep every time the PC boots.
  let wasOk = false;
  function problem(text) {
    if (text && !down && wasOk) alarm();
    if (!text) wasOk = true;
    down = !!text;
    alertEl.classList.remove("practice");
    alertEl.hidden = !text;
    if (text) alertEl.textContent = text;
  }

  // A banner that is information, not an outage (test mode): never sounds.
  function notice(text) {
    down = false;
    alertEl.classList.add("practice");
    alertEl.hidden = false;
    alertEl.textContent = text;
  }

  // Reservations under the bar (see .resv above).
  const resvEl = document.getElementById("resv");
  let resvHtml = "";
  const clockWords = (t) => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}${m ? `:${String(m).padStart(2, "0")}` : ""}${h < 12 ? "am" : "pm"}`; };
  function renderResv(rv) {
    if (!rv) { resvEl.hidden = true; return; }
    const now = Date.now();
    const close = rv.today.filter((r) => ["soon", "now", "held"].includes(r.phase));
    const later = rv.today.filter((r) => r.phase === "later");
    const when = (r) => {
      if (r.phase === "held") return `here? held till ${fmtTime(r.heldUntil)}`;
      const m = Math.round((Date.parse(r.at) - now) / 6e4);
      return m > 0 ? `in ${m} min` : "due now";
    };
    const html = close.map((r) => `<div class="resv-item${r.phase === "soon" ? "" : " now"}">
        <b>Table for ${r.party}</b><span>${esc(r.name)} · ${clockWords(r.time)}</span>
        ${r.notes ? `<span class="notes">${esc(r.notes)}</span>` : ""}<span class="when">${when(r)}</span></div>`).join("")
      + (later.length ? `<p class="resv-line">${close.length ? "Later today" : "Tables today"}: ${later.map((r) => `${clockWords(r.time)} ${esc(r.name)} (${r.party})`).join(" · ")}</p>` : "");
    resvEl.hidden = !html;
    if (html !== resvHtml) resvEl.innerHTML = resvHtml = html;
  }

  // An update changed this page (lib/pages.js): it reloads itself in tick()
  // once nobody's using it, so a cook is never cut off mid-tap.
  let pageVersion = "";
  let pageStale = false;
  let lastTouch = 0;
  for (const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, () => { lastTouch = Date.now(); }, true);

  function apply(data) {
    if (data.pageVersion) {
      pageVersion = pageVersion || data.pageVersion;
      if (data.pageVersion !== pageVersion) pageStale = true;
    }
    serverSound = data.sound !== false;
    renderSound();
    pollSeconds = data.pollSeconds || pollSeconds;
    nextPollAt = data.nextPollAt;
    checking = !!data.checking;
    lastOkAt = data.lastOkAt;
    lastCleared = data.lastCleared;
    clearedList = data.clearedList || [];
    stats = data.stats || null;
    renderCount();
    demo = data.demo || null;
    renderUndo();
    renderResv(data.reservations);

    // Status banner: Square unreachable, or the last good poll is stale.
    const stale = !data.lastOkAt || Date.now() - Date.parse(data.lastOkAt) > 60000 + (data.pollSeconds || 5) * 1000; // checks slow down after hours
    if (data.error || stale) {
      problem(data.lastOkAt
        ? `Can't reach Square — orders shown as of ${fmtTime(data.lastOkAt)}. Check the internet. New orders may be missing.`
        : `Connecting to Square… ${data.error ? "(" + data.error + ")" : ""}`);
    } else {
      // Test mode used to go through problem(), which sounded the alarm and
      // then reset itself, so it went off on every poll.
      if (data.mock) { wasOk = true; notice("TEST MODE — these are fake orders, not from Square."); }
      else if (demo) {
        wasOk = true;
        notice(`DEMO — practice orders (dashed, marked DEMO) until ${fmtTime(demo.until)}. Real orders still show. End it in Settings.`);
      } else problem(null);
    }

    renderWaiting(data.waiting || []);
    const json = JSON.stringify(data.tickets);
    if (json === lastJson) return;
    lastJson = json;
    tickets = data.tickets;

    const fresh = new Set();
    if (known) for (const t of tickets) if (!known.has(t.id)) fresh.add(t.id);
    known = known || new Set();
    for (const t of tickets) known.add(t.id);
    if (fresh.size) {
      const now = Date.now();
      for (const id of fresh) seenAt.set(id, now);
      chime();
      flashEdge();
    }
    render(fresh);
  }

  // An update restarts the board program (lib/system.js) while this window
  // stays open: a few seconds away. Done, Undo and Bring back pressed
  // meanwhile wait here, in order, and go when it's back, so none is lost
  // (the screen shows a Done straight away, as always). Kept in localStorage
  // too, so a reload in between keeps them; one older than two hours is
  // dropped, as the order has moved on by then.
  const QUEUE_KEY = "kb-queue";
  let queued = [];
  try { queued = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]").filter((q) => Date.now() - q.at < 2 * 36e5); } catch {}
  const saveQueue = () => { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queued)); } catch {} };
  function send(path, id) {
    const later = () => { queued.push({ path, id, at: Date.now() }); saveQueue(); };
    if (queued.length) return later(); // keep the order they were pressed in
    post(path, id).catch(later);
  }
  async function flush() {
    while (queued.length) {
      await post(queued[0].path, queued[0].id); // throws while the program is still away
      queued.shift();
      saveQueue();
    }
  }

  // Away for less than this right after being fine is an update's restart:
  // a quiet notice. Longer, it's the alarm.
  const RESTART_GRACE_MS = 45000;
  let lastLoadOk = 0;
  async function load() {
    try {
      if (queued.length) await flush();
      const res = await fetch("/api/tickets", { cache: "no-store" });
      apply(await res.json());
      lastLoadOk = Date.now();
    } catch {
      if (lastLoadOk && Date.now() - lastLoadOk < RESTART_GRACE_MS) {
        notice("Reconnecting to the board program (an update restarts it for a few seconds). Done still works.");
      } else {
        problem("The board program isn't running. Restart the kitchen PC.");
      }
    } finally {
      setTimeout(load, POLL_MS);
    }
  }

  async function post(path, id) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(id ? { id } : {}),
    });
    if (res.ok) apply(await res.json());
  }

  function bump(id) {
    const t = tickets.find((x) => x.id === id);
    if (!t) return;
    // A For Here ticket with items to go: the first Done is the plates,
    // and the ticket stays with just the to-go part (the server does the same).
    const plates = !t.platesDone && t.items.some((it) => it.toGo);
    const name = plates ? `${label(t)} plates` : label(t);
    lastCleared = { id, label: name };
    clearedList = [{ id, label: name, main: t.items[0] ? t.items[0].name : "", at: new Date().toISOString() }, ...clearedList.filter((c) => c.id !== id)];
    renderUndo();
    // Change it right away so the screen feels instant; the server confirms.
    if (plates) tickets = tickets.map((x) => (x.id === id ? { ...t, platesDone: new Date().toISOString() } : x));
    else tickets = tickets.filter((x) => x.id !== id);
    lastJson = "";
    render(new Set());
    send("/api/bump", id);
  }

  // The server keeps what was cleared, newest first: pressing Undo again
  // keeps bringing back older tickets, and it survives a reload or restart.
  function undo() {
    send("/api/undo");
  }

  async function checkNow() {
    checking = true;
    try { await post("/api/refresh"); } catch {}
    checking = false;
  }

  // The countdown ring: full right after a check, empty when the next one
  // is due. Drawn every frame so it moves smoothly rather than in steps.
  function drawRing() {
    let frac = 1;
    if (nextPollAt && !checking) {
      frac = (Date.parse(nextPollAt) - Date.now()) / (pollSeconds * 1000);
      frac = Math.max(0, Math.min(1, frac));
    }
    ringEl.style.strokeDashoffset = String(RING * (1 - frac));
    refreshBtn.classList.toggle("is-checking", checking);
    refreshBtn.classList.toggle("is-down", down);
    requestAnimationFrame(drawRing);
  }
  requestAnimationFrame(drawRing);

  function scrollPage(dir) {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollBy({ top: dir * window.innerHeight * 0.6, behavior: reduce ? "auto" : "smooth" });
  }

  board.addEventListener("click", (e) => {
    const btn = e.target.closest(".done");
    if (btn) bump(btn.closest(".ticket").dataset.id);
  });
  undoBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    openUndoMenu(undoMenu.hidden);
  });
  undoMenu.addEventListener("click", (e) => {
    const id = e.target.closest("[data-unbump]")?.dataset.unbump;
    if (!id) return;
    openUndoMenu(false);
    send("/api/unbump", id);
  });
  document.addEventListener("click", (e) => {
    if (!undoMenu.hidden && !e.target.closest(".undo-wrap")) openUndoMenu(false);
  });
  refreshBtn.addEventListener("click", checkNow);
  soundBtn.addEventListener("click", () => {
    localMute = soundOn; // muting if it was on, unmuting if it was off
    try { localStorage.setItem("kb-muted", localMute ? "1" : "0"); } catch {}
    renderSound();
    if (soundOn) chime(); // so you hear it's back on
  });

  // ---- board menu: settings & help, updates, close, restart, shut down.
  // Mouse only, and every action that takes the board off the screen asks
  // first. Restart and shut down then count down with a big Cancel, because
  // a PC that goes off mid-lunch can't be turned back on remotely.
  const powerBtn = document.getElementById("power");
  const menuEl = document.getElementById("menu");
  const scrim = document.getElementById("scrim");
  const dialog = document.getElementById("dialog");
  const POWER_COUNTDOWN = 5; // seconds before a restart or shut down goes ahead
  let countdown = null;

  function openMenu(open) {
    menuEl.hidden = !open;
    powerBtn.classList.toggle("is-open", open);
    powerBtn.setAttribute("aria-expanded", String(open));
  }
  function closeAll() {
    clearInterval(countdown);
    countdown = null;
    openMenu(false);
    scrim.hidden = true;
    dialog.innerHTML = "";
  }
  function showDialog(html) {
    openMenu(false);
    dialog.innerHTML = html;
    scrim.hidden = false;
    const first = dialog.querySelector("[data-focus]");
    if (first) first.focus();
  }

  async function ask(path, body) {
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Kitchen-Board": "1" },
        body: JSON.stringify(body || {}),
      });
      return await res.json();
    } catch {
      return { ok: false, message: "The board program didn't answer." };
    }
  }

  function message(title, text) {
    showDialog(`<h2 id="dialog-title">${esc(title)}</h2><p>${esc(text)}</p>
      <div class="actions"><button type="button" class="primary" data-close data-focus>OK</button></div>`);
  }

  const POWER = {
    close: {
      title: "Close the board?",
      text: "The board and its program window both close, and the screen goes back to Windows. Orders still print. Run start-kitchen.bat (or restart the PC) to bring the board back.",
      go: "Close the board",
    },
    restart: {
      title: "Restart the kitchen PC?",
      text: "The board is off for a minute or two while Windows restarts. Orders still print.",
      go: "Restart",
      count: "Restarting in",
    },
    shutdown: {
      title: "Shut down the kitchen PC?",
      text: "Nobody can turn it back on remotely. Someone has to press its power button. Orders still print.",
      go: "Shut down",
      count: "Shutting down in",
      danger: true,
    },
  };

  async function runPower(action) {
    const r = await ask("/api/power", { action });
    if (!r.ok) message("Didn't happen", r.message || "Something went wrong.");
  }

  function confirmPower(action) {
    const p = POWER[action];
    showDialog(`<h2 id="dialog-title">${p.title}</h2><p>${p.text}</p>
      <div class="actions">
        <button type="button" data-close data-focus>Cancel</button>
        <button type="button" class="${p.danger ? "danger" : "primary"}" data-go>${p.go}</button>
      </div>`);
    dialog.querySelector("[data-go]").addEventListener("click", () => {
      if (!p.count) { closeAll(); runPower(action); return; }
      let left = POWER_COUNTDOWN;
      showDialog(`<h2 id="dialog-title">${p.count}</h2>
        <p class="count-down" id="count-left">${left}</p>
        <div class="actions"><button type="button" class="primary" data-close data-focus>Cancel</button></div>`);
      countdown = setInterval(() => {
        left -= 1;
        const el = document.getElementById("count-left");
        if (el) el.textContent = left;
        if (left <= 0) { closeAll(); runPower(action); }
      }, 1000);
    });
  }

  async function checkForUpdates() {
    showDialog(`<h2 id="dialog-title">Checking for updates…</h2><p>One moment.</p>`);
    const r = await ask("/api/update");
    if (r.quiet) {
      message("Updated", r.message);
    } else if (r.restarting) {
      showDialog(`<h2 id="dialog-title">Updating</h2><p>${esc(r.message)}</p>`);
    } else {
      message(r.ok ? "Updates" : "Couldn't check", r.message || "Something went wrong.");
    }
  }

  function showSettings() {
    const last = lastOkAt ? fmtTime(lastOkAt) : "not yet";
    showDialog(`<h2 id="dialog-title">Settings &amp; help</h2>
      <div class="keys-table keys">
        <span><b>1</b>–<b>9</b></span><span>Done on that ticket</span>
        <span><b>⌫</b> <b>0</b></span><span>Undo. Press again to go further back.</span>
        <span><b>+</b> <b>−</b></span><span>Scroll down / up</span>
        <span><b>⏎</b></span><span>Check Square now</span>
      </div>
      ${stats ? `<div class="stats">
        <div class="stat"><b>${stats.orders}</b><span>orders today</span></div>
        <div class="stat"><b>${stats.breakfast} / ${stats.lunch}</b><span>breakfast / lunch</span></div>
        <div class="stat"><b>${stats.avgMinutes ?? "–"}${stats.avgMinutes != null ? " min" : ""}</b><span>avg in the kitchen</span></div>
      </div>
      ${stats.topItems.length ? `<p class="top-items">Most ordered: ${stats.topItems.map((i) => `${esc(i.name)} ×${i.qty}`).join(", ")}</p>` : ""}` : ""}
      <p>Sound is <b>${soundOn ? "on" : "off"}</b>. Tap the speaker in the top bar to change it.</p>
      <p class="meta">Checks Square every ${pollSeconds >= 60 ? `${Math.round(pollSeconds / 60)} min` : `${pollSeconds} s`} · last good check ${esc(last)}</p>
      <div class="actions">
        <button type="button" data-demo>${demo ? "End demo" : "Demo orders"}</button>
        <button type="button" data-reset>Reset for the day</button>
        <a class="link-btn" href="/check">Order check page</a>
        <button type="button" class="primary" data-close data-focus>Close</button>
      </div>`);
  }

  // Reset for the day: the Undo lists on both screens empty, so test or
  // last-night tickets can't come back with a stray Backspace, and today's
  // stats start counting from now. Optionally every order on the board is
  // cleared too: the morning after testing, before the doors open.
  function confirmReset() {
    showDialog(`<h2 id="dialog-title">Reset for the day?</h2>
      <p>Clears the Undo list here and on the front page, and today's stats start again from now.</p>
      <label class="check"><input type="checkbox" id="clear-board"> Also clear every order on the board now (after testing, before opening)</label>
      <div class="actions">
        <button type="button" data-close data-focus>Cancel</button>
        <button type="button" class="primary" data-go>Reset</button>
      </div>`);
    dialog.querySelector("[data-go]").addEventListener("click", async () => {
      const clearBoard = document.getElementById("clear-board").checked;
      const r = await ask("/api/reset-day", { clearBoard });
      if (r && r.tickets) { lastJson = ""; apply(r); }
      message("Reset", clearBoard ? "Undo list and stats cleared, and the board is empty." : "Undo list and stats cleared.");
    });
  }
  // Demo: practice orders for showing the staff how the board works. They
  // mix in with real ones (which keep showing), are marked DEMO, never
  // count in the stats, and stop by themselves after 30 minutes.
  async function toggleDemo() {
    const r = await ask("/api/demo", { on: !demo });
    if (r && r.tickets) { lastJson = ""; apply(r); }
    closeAll();
  }
  dialog.addEventListener("click", (e) => {
    if (e.target.closest("[data-reset]")) confirmReset();
    if (e.target.closest("[data-demo]")) toggleDemo();
  });

  powerBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu(menuEl.hidden);
  });
  menuEl.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "settings") showSettings();
    else if (act === "update") checkForUpdates();
    else if (POWER[act]) confirmPower(act);
  });
  document.addEventListener("click", (e) => {
    if (!menuEl.hidden && !e.target.closest(".power-wrap")) openMenu(false);
  });
  scrim.addEventListener("click", (e) => {
    if (e.target === scrim || e.target.closest("[data-close]")) closeAll();
  });

  // Built to run from a number pad alone (spill-resistant; the mouse is for
  // precision). Matched on e.code as well as e.key so the keys work with Num
  // Lock on or off — with it off, Numpad1 sends "End", not "1".
  //   1–9               Done on that ticket
  //   Backspace or 0    Undo (press again to go further back)
  //   − / +             scroll up / down
  //   Enter             check Square now
  document.addEventListener("keydown", (e) => {
    if (!undoMenu.hidden && e.key === "Escape") { openUndoMenu(false); return; }
    // With the menu or a dialog open, the number pad does nothing but
    // Escape closes it. No key can confirm a shutdown: Enter is swallowed
    // here before it reaches a focused button.
    if (!scrim.hidden || !menuEl.hidden) {
      if (e.key === "Escape" || e.key === "Backspace") closeAll();
      if (e.key !== "Tab") e.preventDefault();
      return;
    }
    if (e.repeat) return; // a key held down or leaned on fires once
    const m = /^(?:Numpad|Digit)([0-9])$/.exec(e.code) || /^([0-9])$/.exec(e.key);
    const digit = m ? Number(m[1]) : null;
    if (digit !== null && digit >= 1) {
      const t = tickets.find((x) => slots[x.id] === digit);
      if (t) bump(t.id);
    } else if (digit === 0 || e.key === "Backspace") {
      undo();
    } else if (e.code === "NumpadAdd" || e.key === "+" || e.key === "=") {
      scrollPage(1);
    } else if (e.code === "NumpadSubtract" || e.key === "-") {
      scrollPage(-1);
    } else if (e.key === "Enter") {
      checkNow();
    } else {
      return;
    }
    e.preventDefault();
  });

  // ---- new-order chime (Chrome is launched with autoplay allowed; the
  // first tap anywhere also unlocks audio, in case it wasn't). A service-bell
  // tune, not a blip (Mitch 2026-10-26: it has to be recognised over a busy
  // kitchen): four rising bell notes, ding-ding-ding-DING, played once
  // (2026-10-27; twice was too much), about 1.5 seconds. Each note is a bell, not a pure tone: the note,
  // a softer inharmonic overtone (2.76×, what makes a bell sound like a bell)
  // and a triangle wave under it, which carries better through small speakers
  // and kitchen noise. A compressor keeps the stacked notes from clipping.
  let audio;
  function bell(t0, freq, peak, ring) {
    const out = audio.createGain();
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);
    out.gain.exponentialRampToValueAtTime(0.0001, t0 + ring);
    out.connect(chimeBus());
    for (const [type, mult, level] of [["sine", 1, 1], ["triangle", 1, 0.5], ["sine", 2.76, 0.25]]) {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type;
      o.frequency.value = freq * mult;
      g.gain.value = level;
      o.connect(g).connect(out);
      o.start(t0);
      o.stop(t0 + ring + 0.05);
    }
  }
  let bus;
  function chimeBus() {
    if (!bus) {
      bus = audio.createDynamicsCompressor();
      bus.threshold.value = -12;
      bus.ratio.value = 6;
      bus.connect(audio.destination);
    }
    return bus;
  }
  function chime() {
    if (!soundOn) return;
    try {
      audio = audio || new AudioContext();
      if (audio.state === "suspended") audio.resume();
      const start = audio.currentTime + 0.05;
      // E5, G#5, B5, then E6 held longer: an E major arpeggio.
      const tune = [[659, 0, 0.6], [831, 0.16, 0.6], [988, 0.32, 0.6], [1319, 0.48, 1.0]];
      for (const [freq, at, ring] of tune) bell(start + at, freq, 0.5, ring);
    } catch {}
  }
  // A low falling tone when the board loses Square or its own program,
  // distinct from the new-order chime so nobody mistakes it for an order.
  function alarm() {
    if (!soundOn) return;
    try {
      audio = audio || new AudioContext();
      if (audio.state === "suspended") audio.resume();
      [440, 330, 220].forEach((freq, i) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        const t0 = audio.currentTime + i * 0.3;
        o.type = "square";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
        o.connect(g).connect(audio.destination);
        o.start(t0);
        o.stop(t0 + 0.3);
      });
    } catch {}
  }
  document.addEventListener("pointerdown", () => {
    try { audio = audio || new AudioContext(); audio.resume(); } catch {}
  }, { once: true });

  // ---- kiosk niceties: keep the screen awake, hide an idle mouse pointer
  async function wake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch {}
  }
  wake();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });

  let idleTimer;
  document.addEventListener("pointermove", () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 4000);
  });

  setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
