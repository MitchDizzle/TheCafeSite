          <label>${it.photo ? "Change photo" : "Add photo"}<input type="file" accept="image/*" data-photo="${esc(it.id)}"></label>
          <span class="m-photo-msg" hidden></span>
        </div>
        <div>
          <h3>${esc(it.name)}</h3>
          ${it.lists.length ? it.lists.map((l) => `<div class="m-list" data-list="${esc(l.id)}">
            <p class="m-list-name">${esc(l.name)}</p>
            <div class="m-opts">${l.options.map(optHtml).join("")}</div>
            <div class="m-add"><input type="text" placeholder="New option, e.g. Turtle" maxlength="60" aria-label="New option for ${esc(l.name)}"><button type="button" data-add>Add</button></div>
          </div>`).join("") : `<p class="m-note">No options in Square for this one.</p>`}
        </div>
      </section>`;
    screen({ title: "Desserts", back: true,
      body: `<p class="m-note">Unticked options are hidden from online ordering and come back with one tick.
        On the iPad, mark a flavor sold out from the iPad itself. A new photo goes to Square straight away.</p>
        <form id="m-desserts">${r.items.map(itemHtml).join("")}</form>`,
      buttons: [{ label: "Save to Square", submit: "m-desserts", kind: "primary" }] });
    const form = document.getElementById("m-desserts");
    form.addEventListener("change", (e) => {
      const opt = e.target.closest("[data-opt]");
      if (opt) opt.closest(".check").classList.toggle("off", !opt.checked);
      const file = e.target.closest("[data-photo]");
      if (file && file.files[0]) uploadPhoto(file, file.files[0]);
    });
    // Add puts the new option in the list, ticked; it's saved with the rest.
    form.addEventListener("click", (e) => {
      if (!e.target.closest("[data-add]")) return;
      const box = e.target.closest(".m-list");
      const input = box.querySelector(".m-add input");
      const name = input.value.replace(/\s+/g, " ").trim();
      if (!name) return input.focus();
      box.querySelector(".m-opts").insertAdjacentHTML("beforeend",
        `<label class="check"><input type="checkbox" data-new="${esc(name)}" checked><span>${esc(name)} <small>(new)</small></span></label>`);
      input.value = "";
    });
    form.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.closest(".m-add input")) { e.preventDefault(); e.target.closest(".m-add").querySelector("[data-add]").click(); }
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const lists = [...form.querySelectorAll("[data-list]")].map((l) => ({
        id: l.dataset.list,
        options: [...l.querySelectorAll("[data-opt]")].map((x) => ({ id: x.dataset.opt, off: !x.checked })),
        add: [...l.querySelectorAll("[data-new]:checked")].map((x) => x.dataset.new),
      }));
      busy("Desserts", "Saving to Square…");
      result("Desserts", await postJson("/api/front-desserts-save", { pin: pinValue, lists }));
    });
  }

  // A photo from the phone: shrunk to 1600px on the long side and re-drawn
  // as a JPEG here, before it leaves the phone. Re-drawing drops everything
  // but the picture, including the GPS location phones write into photos.
  async function uploadPhoto(input, file) {
    const card = input.closest(".m-photo");
    const msg = card.querySelector(".m-photo-msg");
    msg.hidden = false;
    msg.textContent = "Uploading…";
    try {
      const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
      const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const photo = canvas.toDataURL("image/jpeg", 0.85);
      const r = await postJson("/api/front-dessert-photo", { pin: pinValue, itemId: input.dataset.photo, photo });
      msg.textContent = r.ok ? "✓ Saved" : r.message;
      if (r.ok) {
        const img = card.querySelector("img") || Object.assign(document.createElement("img"), { alt: "" });
        img.src = photo;
        card.querySelector(".m-nophoto")?.replaceWith(img);
      }
    } catch {
      msg.textContent = "Couldn't read that photo. Try another.";
    }
    input.value = "";
  }

  // ---- What the kitchen skips
  async function openSkip() {
    busy("What the kitchen skips", "Reading Square's items…");
    const r = await postJson("/api/front-skip", { pin: pinValue });
    if (!r.ok) return result("What the kitchen skips", r);
    const lc = (x) => x.trim().toLowerCase();
    const cats = new Set(r.skip.categories.map(lc));
    const items = new Set(r.skip.items.map(lc));
    const known = new Set(r.categories.flatMap((c) => c.items).map(lc));
    // Names on the list that aren't Square items (renamed, deleted, or typed
    // into config.json): kept unless unticked.
    const other = r.skip.items.filter((n) => !known.has(lc(n)));
    const box = (attr, value, checked, text, disabled) =>
      `<label class="check"><input type="checkbox" ${attr}="${esc(value)}"${checked ? " checked" : ""}${disabled ? " disabled" : ""}><span>${esc(text)}</span></label>`;
    const catHtml = (c) => {
      const whole = cats.has(lc(c.name)) && c.name !== "(No category)";
      const picked = c.items.filter((n) => items.has(lc(n))).length;
      return `<details class="skip-cat" data-whole="${whole ? 1 : 0}"${whole || picked ? " open" : ""}>
        <summary>${c.name === "(No category)" ? `<span>${esc(c.name)}</span>` : box("data-cat", c.name, whole, `${c.name}: the whole category`)}
          <span class="count">${c.items.length} item${c.items.length === 1 ? "" : "s"}</span></summary>
        <div class="skip-items">${c.items.map((n) => box("data-item", n, whole || items.has(lc(n)), n, whole)).join("")}</div>
      </details>`;
    };
    screen({ title: "What the kitchen skips", back: true,
      body: `<p class="m-note">Ticked items stay off the kitchen board and go on the front's "Add from the front" list.
        A ticked category also covers items added to it in Square later.</p>
        ${r.catalogError ? `<p class="m-error">Couldn't read Square's items (${esc(r.catalogError)}). Only the names already on the list are shown.</p>` : ""}
        <form id="m-skip">
          ${r.categories.map(catHtml).join("")}
          ${other.length ? `<details class="skip-cat" open><summary><span>Other names on the list</span></summary>
            <div class="skip-items">${other.map((n) => box("data-item", n, true, n, false)).join("")}</div></details>` : ""}
        </form>`,
      buttons: [{ label: "Save", submit: "m-skip", kind: "primary" }] });
    const form = document.getElementById("m-skip");
    // A whole category ticks and locks its items, so it reads as it acts.
    form.addEventListener("change", (e) => {
      const cat = e.target.closest("[data-cat]");
      if (!cat) return;
      const details = cat.closest(".skip-cat");
      details.dataset.whole = cat.checked ? "1" : "0";
      for (const it of details.querySelectorAll("[data-item]")) {
        it.disabled = cat.checked;
        if (cat.checked) it.checked = true;
      }
      if (cat.checked) details.open = true;
    });
    // The summary's checkbox must tick, not also fold the category.
    form.addEventListener("click", (e) => {
      if (e.target.closest("summary label")) e.stopPropagation();
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const skip = {
        categories: [...form.querySelectorAll("[data-cat]:checked")].map((x) => x.dataset.cat),
        // Items inside a skipped category are covered by it; only the rest are listed.
        items: [...form.querySelectorAll("[data-item]:checked:not(:disabled)")].map((x) => x.dataset.item),
      };
      busy("What the kitchen skips", "Saving…");
      const res = await postJson("/api/front-skip-save", { pin: pinValue, skip });
      lastJson = "";
      result("What the kitchen skips", res);
    });
  }

  // ---- Reset for the day: its own screen, because it can't be undone.
  function openReset() {
    screen({ title: "Reset for the day", back: true,
      body: `<p>Today's numbers start again from now, and the Undo lists on both screens are emptied. Orders already on the board stay.</p>
        <label class="check m-check"><input type="checkbox" id="clear-board">
          <span><b>Also clear every order off the board and this page.</b><br>For the morning after testing, before opening.</span></label>`,
      buttons: [{ label: "Reset for the day", act: "do-reset", kind: "danger" }] });
  }
  async function runReset() {
    const clearBoard = document.getElementById("clear-board").checked;
    busy("Reset for the day", "Resetting…");
    const r = await postJson("/api/front-reset", { pin: pinValue, clearBoard });
    if (r.ok) lastJson = "";
    result("Reset for the day", r);
  }

  // ---- Check for updates: the board's own update; it restarts if there's one.
  async function runUpdate() {
    busy("Check for updates", "Checking…");
    const r = await postJson("/api/front-update", { pin: pinValue });
    if (r.restarting) {
      screen({ title: "Updating", back: false, body: `<p class="m-result good">${esc(r.message)}</p>`,
        buttons: [{ label: "Done", act: "close", kind: "primary" }] });
    } else result("Check for updates", r);
  }

  setInterval(tick, 15000);

})();
